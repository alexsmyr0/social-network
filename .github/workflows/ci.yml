name: CI

on:
  push:
    branches: [main, 'asmyrogl/B07-resubmit']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Install locked dependencies
        run: make deps
      - name: Install browser system dependencies
        run: bun x playwright install --with-deps chromium
      - name: Shared quality and two-image gate
        run: make check
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
