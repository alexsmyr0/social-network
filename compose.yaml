name: social-network

services:
  backend:
    image: social-network-backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_PATH: /data/social.db
      MEDIA_ROOT: /data/media
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - backend-data:/data
  frontend:
    image: social-network-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
