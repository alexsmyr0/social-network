<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Forum</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="A modern, real-time forum experience with instant messaging and community interaction.">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/css/main.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
        <div class="spinner"></div>
    </div>

    <div id="app">
        <!-- The persistent shell and features will be rendered here by main.js -->
        <main id="main-content" aria-live="polite">
            <!-- Dynamic content injected here -->
        </main>
    </div>

    <!-- Main JavaScript Entry Point -->
    <script type="module" src="/main.js"></script>
</body>
</html>
